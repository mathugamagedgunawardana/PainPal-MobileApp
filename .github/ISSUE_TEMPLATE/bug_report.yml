name: Bug Report
description: Report a bug in the PainPal mobile app
title: "[Bug]: "
labels: ["bug", "mobile"]
body:
  - type: markdown
    attributes:
      value: |
        **Backend/API bugs:** file in [PainPal-Web](https://github.com/YOUR_ORG/PainPal-Web/issues).
        **No PHI in reports.**

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
        - Web (Flutter web)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.0.0+1

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Flutter version, device model, OS version, API_BASE_URL

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: No protected health information included
          required: true
